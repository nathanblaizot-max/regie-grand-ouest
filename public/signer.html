<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#023047">
<title>Signer le devis</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--fg:#0b2533;--mut:#5b6b78;--line:#dde4ea;--pri:#023047;--gold:#d4b95a;--ok:#1d7a4d;--bad:#b3261e;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a22;--card:#14252f;--fg:#e8eff4;--mut:#9db0bd;--line:#26404f;--pri:#d4b95a;--gold:#d4b95a;--ok:#5fcf97;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.mut{color:var(--mut)}.small{font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th:not(:first-child),td:not(:first-child){text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.tot{display:flex;flex-direction:column;gap:3px;align-items:flex-end;margin-top:10px;font-variant-numeric:tabular-nums}
.tot .big{font-size:20px;font-weight:700}
canvas{width:100%;height:170px;border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--fg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#0d1a22}}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:10px;font-weight:600}
.msg.ok{background:rgba(29,122,77,.12);color:var(--ok)}.msg.bad{background:rgba(179,38,30,.1);color:var(--bad)}
details summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;font:inherit;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card mut">Chargement du devis…</div></div>
<script>
(function(){
var app=document.getElementById('app'),T=new URLSearchParams(location.search).get('t')||'',D=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return (Math.round((+n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function fd(s){if(!s)return '';var p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function fail(t,m){app.innerHTML='<div class="card"><h1>'+esc(t)+'</h1><p class="mut">'+esc(m)+'</p></div>';}
function load(){
  if(!T){fail('Lien incomplet','Ce lien de signature n\'est pas valide. Demandez-en un nouveau à votre loueur.');return;}
  fetch('/api/public/devis?t='+encodeURIComponent(T)).then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});}).then(function(x){
    if(x.s===404){fail('Lien introuvable','Ce lien n\'existe plus ou a été remplacé. Contactez votre loueur.');return;}
    if(x.s===429){fail('Trop de tentatives','Réessayez dans quelques minutes.');return;}
    if(!x.j.devis){fail('Erreur','Impossible de charger le devis.');return;}
    D=x.j.devis;draw();
  }).catch(function(){fail('Connexion impossible','Vérifiez votre connexion puis rechargez la page.');});
}
function draw(){
  var d=D,s=d.societe,h='';
  h+='<div class="card"><div class="mut small">'+esc(s.nom)+(s.adresse?' · '+esc(s.adresse):'')+(s.tel?' · '+esc(s.tel):'')+'</div><h1>Devis '+esc(d.numero)+'</h1><div class="mut">'+(d.titre?esc(d.titre)+' · ':'')+'pour '+esc(d.client)+'</div>'
   +'<div class="small mut" style="margin-top:6px">'+(d.dateDebut?'Du '+fd(d.dateDebut)+' au '+fd(d.dateFin||d.dateDebut):'')+(d.lieu?' · '+esc(d.lieu):'')+(d.dateValidite?' · valable jusqu\'au '+fd(d.dateValidite):'')+'</div></div>';
  h+='<div class="card"><h2>Détail</h2><div class="tw"><table><thead><tr><th>Désignation</th><th>Qté</th><th>PU HT</th><th>Total HT</th></tr></thead><tbody>'
   +d.lignes.map(function(l){return '<tr><td>'+esc(l.designation)+'</td><td>'+esc(l.qte)+'</td><td>'+money(l.puHT)+'</td><td>'+money((+l.qte||0)*(+l.puHT||0))+'</td></tr>';}).join('')
   +'</tbody></table></div><div class="tot"><div><span class="mut">Total HT</span> '+money(d.totaux.ht)+'</div>'
   +(d.regimeTva==='franchise'?'<div class="small mut">TVA non applicable (art. 293 B du CGI)</div>':(d.totaux.detail||[]).map(function(x){return '<div><span class="mut">TVA '+String(x.taux).replace('.',',')+' %</span> '+money(x.montant)+'</div>';}).join(''))
   +'<div class="big">Total TTC '+money(d.totaux.ttc)+'</div>'
   +(d.acomptePct>0?'<div class="small mut">Acompte demandé à la réservation : '+money(d.totaux.ttc*d.acomptePct/100)+' ('+String(d.acomptePct).replace('.',',')+' %)</div>':'')+'</div></div>';
  if(s.conditions||s.cgv)h+='<div class="card"><details><summary>Conditions de location</summary>'+(s.conditions?'<pre>'+esc(s.conditions)+'</pre>':'')+(s.cgv?'<pre>'+esc(s.cgv)+'</pre>':'')+'</details></div>';
  if(d.signe){h+='<div class="msg ok">Ce devis a été accepté et signé'+(d.signataire?' par '+esc(d.signataire):'')+(d.dateSignature?' le '+fd(d.dateSignature):'')+'. Merci !</div>';}
  else if(d.statut==='refuse'||d.statut==='annule'){h+='<div class="msg bad">Ce devis n\'est plus disponible. Contactez votre loueur.</div>';}
  else if(d.expire){h+='<div class="msg bad">Ce devis a dépassé sa date de validité. Contactez votre loueur pour en obtenir un nouveau.</div>';}
  else{
    h+='<div class="card"><h2>Bon pour accord</h2><label for="nom">Votre nom et prénom</label><input id="nom" type="text" autocomplete="name" placeholder="Ex. Marie Martin">'
     +'<label>Votre signature (au doigt ou à la souris)</label><canvas id="cv" width="640" height="340" aria-label="Zone de signature"></canvas>'
     +'<div class="row" style="margin-top:8px"><button class="btn sec" id="clr" type="button">Effacer</button></div>'
     +'<label class="row" style="font-weight:400;margin-top:14px"><input type="checkbox" id="ok"> <span>Je reconnais avoir pris connaissance du devis et des conditions ci-dessus et je l\'accepte (« Bon pour accord »).</span></label>'
     +'<div class="row" style="margin-top:12px"><button class="btn" id="go" type="button" disabled>Signer et accepter le devis</button></div><div id="err" class="small" style="color:var(--bad);margin-top:8px"></div></div>';
  }
  app.innerHTML=h;
  if(!d.signe&&!d.expire&&d.statut!=='refuse'&&d.statut!=='annule')pad();
}
function pad(){
  var cv=document.getElementById('cv'),cx=cv.getContext('2d'),dr=false,ink=false,nom=document.getElementById('nom'),ok=document.getElementById('ok'),go=document.getElementById('go');
  cx.lineWidth=3;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#0b2533';
  function pt(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];}
  function upd(){go.disabled=!(ink&&ok.checked&&nom.value.trim().length>=2);}
  cv.addEventListener('pointerdown',function(e){dr=true;cv.setPointerCapture(e.pointerId);var p=pt(e);cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(p[0]+.1,p[1]+.1);cx.stroke();ink=true;upd();e.preventDefault();});
  cv.addEventListener('pointermove',function(e){if(!dr)return;var p=pt(e);cx.lineTo(p[0],p[1]);cx.stroke();e.preventDefault();});
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){dr=false;});});
  document.getElementById('clr').onclick=function(){cx.clearRect(0,0,cv.width,cv.height);ink=false;upd();};
  nom.addEventListener('input',upd);ok.addEventListener('change',upd);
  go.onclick=function(){
    go.disabled=true;var err=document.getElementById('err');err.textContent='';
    var img=cv.toDataURL('image/png');
    fetch('/api/public/sign',{method:'POST',headers:{'content-type':'application/json','x-requested-with':'regie'},body:JSON.stringify({t:T,nom:nom.value.trim(),img:img})})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});}).then(function(x){
      if(x.s===200){D.signe=true;D.signataire=nom.value.trim();D.dateSignature=new Date().toISOString().slice(0,10);draw();window.scrollTo(0,0);return;}
      var m={'deja-signe':'Ce devis est déjà signé.','expire':'Ce devis a expiré.','indisponible':'Ce devis n\'est plus disponible.','nom':'Indiquez votre nom.','signature':'Signature invalide, recommencez.'};
      err.textContent=m[x.j.error]||'La signature n\'a pas pu être enregistrée. Réessayez.';upd();
    }).catch(function(){err.textContent='Connexion impossible. Réessayez.';upd();});
  };
}
load();
})();
</script>
</body>
</html>
