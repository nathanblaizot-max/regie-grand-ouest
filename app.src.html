<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&display=swap">
<style>
/* Plan : outil de gestion d'une société de location de matériel événementiel.
   Disposition : barre latérale (bureau) ou onglets défilants (téléphone), contenu en cartes sobres.
   Couleurs du site Sud Manche Locations : bleu nuit #023047, or #D0BB63, gris bleutés neutres, vert/ambre/rouge pour les états.
   Typo : Bricolage Grotesque pour les titres, DM Sans pour le reste. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#023047; --muted:#51697A; --line:#DCE5EB;
  --accent:#023047; --accent-ink:#FFFFFF; --accent-soft:#E2EDF3; --sun:#D0BB63; --sun-soft:#F8F1D3;
  --gold:#D0BB63; --gold-ink:#023047; --side-bg:#023047; --side-ink:#EAF1F5; --side-muted:#9DB6C5;
  --ok:#17794F; --ok-soft:#DDF3E8; --warn:#8A6A00; --warn-soft:#FBF1CB; --bad:#B93232; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(2,48,71,.06),0 10px 28px rgba(2,48,71,.07);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#021B28; --surface:#06293A; --surface-2:#0B3449; --ink:#EAF1F5; --muted:#9DB4C2; --line:#174559;
    --accent:#DCC76E; --accent-ink:#021B28; --accent-soft:#123E55; --sun:#D0BB63; --sun-soft:#3A3414;
    --gold:#D0BB63; --gold-ink:#023047; --side-bg:#01202F; --side-ink:#EAF1F5; --side-muted:#9DB6C5;
    --ok:#5FD39B; --ok-soft:#14352A; --warn:#F0C766; --warn-soft:#3A3010; --bad:#FF8A8A; --bad-soft:#3E1A1F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#021B28; --surface:#06293A; --surface-2:#0B3449; --ink:#EAF1F5; --muted:#9DB4C2; --line:#174559;
  --accent:#DCC76E; --accent-ink:#021B28; --accent-soft:#123E55; --sun:#D0BB63; --sun-soft:#3A3414;
  --gold:#D0BB63; --gold-ink:#023047; --side-bg:#01202F; --side-ink:#EAF1F5; --side-muted:#9DB6C5;
  --ok:#5FD39B; --ok-soft:#14352A; --warn:#F0C766; --warn-soft:#3A3010; --bad:#FF8A8A; --bad-soft:#3E1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-l{flex-direction:column;align-items:flex-start;gap:6px}
.brand-logo{display:block;width:100%;max-width:150px;height:auto;background:#fff;border-radius:12px 3px 12px 3px;padding:6px 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:17px}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:28px;font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{padding:16px 18px}
.cal-chip.ps-ok{background:var(--ok-soft);color:var(--ok);border-left:3px solid var(--ok)}
.cal-chip.ps-pay{background:var(--accent-soft);color:var(--accent);border-left:3px solid var(--accent)}
.cal-chip.ps-rec{background:var(--sun-soft);color:var(--warn);border-left:3px solid var(--gold)}
.cal-chip.ps-no{background:var(--bad-soft);color:var(--bad);border-left:3px solid var(--bad)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend .lg{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg.ps-ok{background:var(--ok)}.lg.ps-pay{background:var(--accent)}.lg.ps-rec{background:var(--gold)}.lg.ps-no{background:var(--bad)}
.sig-wrap{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;margin-top:6px}
#sig-pad{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair;border-radius:10px}
.sig-hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#9AA9B4;pointer-events:none;font-size:18px}
.sig-done{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.sig-done img{display:block;max-width:240px;width:100%;height:auto;background:#fff;border-radius:6px;margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}.opt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:var(--surface-2);border-radius:10px}.opt-t{display:inline-flex;align-items:center;gap:6px;font-weight:600;min-width:92px}.opt input{width:80px}.opt-add{align-self:flex-start}
.dsec{display:grid;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px 4px 14px 4px;background:var(--surface)}
.dsec>h3{display:flex;align-items:center;gap:10px;font-size:15px;margin:0}
.dn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:800}
.picker{display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--surface-2)}
.pick-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip-btn.on{background:var(--accent);color:var(--accent-ink,#fff);border-color:var(--accent)}
.pick-res{display:grid;gap:4px;max-height:260px;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.logo-set{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.logo-prev{height:54px;max-width:200px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.cx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.cx-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}.cx-stat b{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.cx-tarifs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cx-t{padding:14px;text-align:center;display:grid;gap:6px}.cx-th{display:flex;justify-content:space-between;gap:8px}.cx-n{font-family:var(--font-display);font-size:34px;line-height:1;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}.cx-btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:6px}.cx-btns .btn{min-height:56px;font-size:18px;font-weight:700;touch-action:manipulation;justify-content:center}.cx-plus{background:var(--accent);color:var(--accent-ink)}
.cx-modes{grid-template-columns:repeat(3,minmax(0,1fr))}.cx-mode b{font-size:18px}.cx-m{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--line)}.cx-ml{display:flex;justify-content:space-between;align-items:center;font-weight:600}.cx-ml .cx-n{font-size:34px}.cx-sub{padding-top:6px;border-top:1px solid var(--line)}.cx-btns .btn{min-height:46px}
.cx-trow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 36px;gap:8px;align-items:end;margin-bottom:6px}.cx-ok{color:var(--ok);font-weight:600}.cx-bad{color:var(--bad);font-weight:600}
.modal-bg.typing .modal-f{display:none}
.chip-tog{border:0;cursor:pointer;font:inherit;font-size:inherit}.chip-tog:hover{filter:brightness(.95);outline:1px solid currentColor}
.pick-row:hover{border-color:var(--gold)}
.pick-n{flex:1 1 auto;min-width:0;display:grid}
.pick-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-m{display:grid;text-align:right;gap:1px}
.pick-plus{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:18px;flex:0 0 auto}
.foot-total{margin-right:auto;display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-size:18px}
.modal-f{position:sticky;bottom:0;z-index:3;align-items:center}
.grp-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.grp-h td{background:var(--surface-2);color:var(--accent)}
.kpi-link{cursor:pointer;transition:transform .12s,box-shadow .12s}.kpi-link:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(2,48,71,.14)}.kpi-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kpi-l{font-size:13px;color:var(--muted);font-weight:500}
.kpi-v{font-family:var(--font-display);font-size:28px;font-weight:800;margin-top:4px}
.kpi-s{font-size:13px;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn-ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:40px}
textarea{min-height:76px;resize:vertical}
input[type="checkbox"]{width:auto;min-height:0}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:var(--surface-2)}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.sun{background:var(--sun-soft);color:var(--warn);border-color:transparent}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.list-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-row:last-child{border-bottom:0}
.sec-title{font-size:17px;font-weight:800;padding:14px 16px 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px;text-align:center;border-bottom:1px solid var(--line)}
.cal-d{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;min-width:0;background:var(--surface)}
.cal-d:nth-child(7n+14){border-right:0}
.cal-d.out{background:var(--surface-2);color:var(--muted)}
.cal-d.today .cal-n{background:var(--accent);color:var(--accent-ink)}
.cal-d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal-n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;font-size:13px;font-weight:700;padding:0 6px}
.cal-chip{display:block;font-size:11px;font-weight:600;border-radius:5px;padding:2px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.cal-chip.opt{background:var(--sun-soft);color:var(--warn)}
.cal-chip.fin{background:var(--ok-soft);color:var(--ok)}
.cal-dot{display:none;font-size:11px;font-weight:700;color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,34,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(920px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:20px;font-weight:800}
.modal-b{padding:18px 20px;display:grid;gap:16px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 14px 14px}
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px 92px 84px 92px 32px;gap:6px;align-items:start;padding:4px 0;border-bottom:1px solid var(--line)}.line .lbl{display:none}.line input{padding:7px 8px}.line-t{padding-top:9px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}.line-t small{display:block;color:var(--muted);font-size:11px}.line .avail.ok{display:none}.line-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding:0 0 4px}.line .del-l{justify-self:end}
.line-h{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.line-t{padding-top:10px;text-align:right;font-weight:600;white-space:nowrap}
.avail{font-size:12px;margin-top:3px}
.avail.bad{color:var(--bad);font-weight:700}
.avail.ok{color:var(--ok)}
.totals{margin-left:auto;width:min(340px,100%);display:grid;gap:6px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .big{font-family:var(--font-display);font-size:20px;font-weight:800;border-top:1px solid var(--line);padding-top:8px}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.doc-view{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}
.banner{border-radius:10px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-bottom:14px}
.stock-in{width:78px;text-align:right}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 12px 6px;gap:8px;top:auto}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}

  .line-hrow{display:none}

/* --- Identité Sud Manche Locations : bleu nuit + or, coins asymétriques --- */
body{background:linear-gradient(180deg,var(--accent-soft) 0,var(--bg) 240px) no-repeat,var(--bg)}
.side{background:var(--side-bg);border-right:0;color:var(--side-ink)}
.brand-mark{background:var(--gold);color:var(--gold-ink);border-radius:14px 3px 14px 3px;width:40px;height:40px;font-size:19px}
.brand-name{color:var(--side-ink)}
.brand-sub{color:var(--side-muted)}
.nav button{color:var(--side-muted);border-radius:10px 3px 10px 3px;padding:10px 12px}
.nav button:hover{background:rgba(255,255,255,.07);color:var(--side-ink)}
.nav button[aria-current="page"]{background:rgba(208,187,99,.18);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.page-head h1{font-size:30px;letter-spacing:-.01em;color:var(--ink)}
.page-head h1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--gold);margin-top:8px}
.card{border-radius:16px 4px 16px 4px;border-color:var(--line)}
.card.kpi{position:relative;overflow:hidden;padding:18px 20px}
.card.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi-v{color:var(--ink);font-size:30px}
.btn{border-radius:12px 3px 12px 3px;border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--gold);background:var(--surface-2)}
.btn-primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);border-radius:20px 4px 20px 4px;box-shadow:0 4px 12px rgba(208,187,99,.35)}
.btn-primary:hover{background:var(--gold);filter:brightness(1.06);box-shadow:0 6px 16px rgba(208,187,99,.45)}
.btn-sm{border-radius:10px 3px 10px 3px}
.btn-sm.btn-primary{border-radius:14px 3px 14px 3px}
input,select,textarea{border-radius:10px;border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
:focus-visible{outline-color:var(--gold)}
th{background:var(--surface-2);color:var(--muted)}
tr.row-click:hover td{background:var(--sun-soft)}
.chip{border-radius:999px}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.sec-title{color:var(--ink);display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.list-row:hover{background:var(--surface-2)}
.cal-d.today .cal-n{background:var(--gold);color:var(--gold-ink)}
.cal-d.sel{outline-color:var(--gold)}
.cal-chip{background:var(--accent-soft);color:var(--accent);border-left:3px solid var(--accent)}
.cal-chip.opt{background:var(--sun-soft);color:var(--warn);border-left-color:var(--gold)}
.cal-chip.fin{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.cal-dot{color:var(--accent)}
.modal{border-radius:20px 4px 20px 4px}
.modal-h{background:var(--side-bg);color:var(--side-ink);border-radius:20px 4px 0 0;border-bottom:3px solid var(--gold)}
.modal-h h2,.modal-h .icon-btn{color:var(--side-ink)}
.modal-h .icon-btn:hover{background:rgba(255,255,255,.1)}
.modal-f{border-radius:0 0 4px 20px}
.totals .big{color:var(--ink)}
.toast{background:var(--side-bg);color:var(--side-ink);border-left:4px solid var(--gold)}
.empty h3{color:var(--ink)}
@media (max-width:900px){
  .side{padding:14px 12px 8px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--gold)}
}
.cal-chip.past{background:var(--surface-2);color:var(--muted);border-left:3px solid var(--muted)}
</style>

function totals(lignes,franchise){
  var ht=0,par={};
  (lignes||[]).forEach(function(l){var t=num(l.qte)*num(l.puHT);ht+=t;var rate=franchise?0:num(l.tva);par[rate]=(par[rate]||0)+t;});
  var tvaTot=0,detail=[];
  Object.keys(par).forEach(function(k){var m=r2(par[k]*num(k)/100);tvaTot+=m;if(num(k)>0)detail.push({taux:num(k),base:r2(par[k]),montant:m});});
  ht=r2(ht);tvaTot=r2(tvaTot);
  return {ht:ht,tva:tvaTot,ttc:r2(ht+tvaTot),detail:detail};
}
function legalOf(soc,k){return (soc&&soc[k])||S.set[k]||'';}
function legalLines(soc){
  var o=[],f=legalOf(soc,'forme'),c=legalOf(soc,'capital'),r=legalOf(soc,'rcsVille'),si=legalOf(soc,'siren')||String(legalOf(soc,'siret')).replace(/\D/g,'').slice(0,9);
  if(f||c)o.push((f||'Société')+(c?' au capital de '+c:''));
  if(r||si)o.push((r?'RCS '+r+' ':'SIREN ')+si);
  return o;
}
function sirenOf(cl){var d=String((cl&&cl.siret)||'').replace(/\D/g,'');return d.length>=9?d.slice(0,9).replace(/(\d{3})(?=\d)/g,'$1 '):'';}
function natureOp(d){return (d.lignes||[]).some(function(l){return /consommable|vente/i.test(l.designation||'');})?'Opération mixte (prestation de services et livraison de biens)':'Prestation de services (location de matériel)';}
function mentionsFacture(d,soc){var m=['Nature de l\'opération : '+natureOp(d)+'.','Pas d\'escompte pour paiement anticipé.'];if(legalOf(soc,'tvaDebits')==='oui')m.push('TVA acquittée d\'après les débits.');return m;}
function socSnap(){return {nom:S.set.nom,adresse:S.set.adresse,tel:S.set.tel,email:S.set.email,siret:S.set.siret,siren:S.set.siren||'',tvaNumero:S.set.tvaNumero,forme:S.set.forme||'',capital:S.set.capital||'',rcsVille:S.set.rcsVille||'',tvaDebits:S.set.tvaDebits||'non',penalites:S.set.penalites,conditions:S.set.conditions,cgv:S.set.cgv||'',rib:S.set.rib};}
function chkSiren(cid){var c=byId(S.clients,cid);if(c&&c.type==='pro'&&!sirenOf(c))setTimeout(function(){toast('Client professionnel : renseignez son SIRET (le SIREN est obligatoire sur la facture).');},1800);}
function isPaid(d){
  if(typeof d.paye==='boolean')return d.paye;
  var f=docsOf(d.id).filter(function(x){return x.type==='facture'&&x.statut!=='annulee';});
  if(f.length)return f.every(function(x){return x.statut==='payee';});
  return String(d.notes||'').indexOf('Payé :')>=0;
}
function acList(d){return (d&&d.acomptes)||[];}
function acTot(d){return Math.round(acList(d).reduce(function(s,a){return s+num(a.montant);},0)*100)/100;}
function resteDu(d){return Math.max(0,Math.round((d.totaux.ttc-acTot(d))*100)/100);}
function acHtml(d){
  var l=acList(d);if(!l.length)return '';
  var isD=d.type==='devis',h=l.map(function(a,i){
    return '<div><span class="muted">Acompte reçu le '+fmtD(a.date)+' ('+esc(a.mode||'')+')'+(isD?' <button class="btn btn-sm" data-action="ac-del" data-id="'+esc(d.id)+'" data-i="'+i+'">'+(S.confirm==='ac'+i?'Confirmer':'Retirer')+'</button>':'')+'</span><span>− '+money(num(a.montant))+'</span></div>';}).join('');
  return h+'<div class="big"><span>Reste à payer</span><span>'+money(resteDu(d))+'</span></div>';
}
function isRecup(d){return d.statut==='terminee';}
function payCls(d){var p=isPaid(d),r=isRecup(d);return p?(r?'ps-ok':'ps-pay'):(r?'ps-rec':'ps-no');}
function payTip(d){return (isPaid(d)?'Payé':'Pas payé')+' · '+(isRecup(d)?'Récupéré':'Pas récupéré');}
function planDay(d,date){return (ACTIFS.indexOf(d.statut)>=0||d.statut==='terminee')&&d.dateDebut&&d.dateFin&&d.dateDebut<=date&&date<=d.dateFin;}
function activeDay(d,date){return ACTIFS.indexOf(d.statut)>=0&&d.dateDebut&&d.dateFin&&d.dateDebut<=date&&date<=d.dateFin;}
function reservedMax(mid,start,end,excl){
  if(!start||!end||end<start)return 0;
  var days=eachDay(start,end),max=0;
  days.forEach(function(day){
    var s=0;
    actifsLignes().forEach(function(d){
      if(d.id===excl||!activeDay(d,day))return;
      (d.lignes||[]).forEach(function(l){if(l.materielId===mid)s+=num(l.qte);});
    });
    if(s>max)max=s;
  });
  return max;
}
function conflits(){
  var use={},ids={};
  actifsLignes().forEach(function(d){
    var seen={};
    (d.lignes||[]).forEach(function(l){if(!l.materielId||!num(l.qte))return;seen[l.materielId]=(seen[l.materielId]||0)+num(l.qte);});
    Object.keys(seen).forEach(function(mid){
      var m=use[mid]=use[mid]||{};
      eachDay(d.dateDebut,d.dateFin).forEach(function(day){var c=m[day]=m[day]||{q:0,ids:[]};c.q+=seen[mid];c.ids.push(d.id);});
    });
  });
  var out=[],days={};
  Object.keys(use).forEach(function(mid){
    var m=byId(S.materiel,mid);if(!m)return;
    var dispo=dispoInfo(m),first='',last='',max=0,set={};
    Object.keys(use[mid]).sort().forEach(function(day){
      var c=use[mid][day];if(c.q<=dispo)return;
      if(!first)first=day;last=day;if(c.q>max)max=c.q;days[day]=true;c.ids.forEach(function(i){set[i]=1;});
    });
    if(first)out.push({mid:mid,nom:m.nom,dispo:dispo,max:max,from:first,to:last,ids:Object.keys(set)});
  });
  out.days=days;return out;
}
function dispoInfo(m){return Math.max(0,num(m.stock)-num(m.horsService));}
function nextNumber(type){
  var y=new Date().getFullYear(),pre=(type==='devis'?'D':'F')+'-'+y+'-',max=0;
  S.documents.forEach(function(d){if(d.type===type&&String(d.numero).indexOf(pre)===0){var n=parseInt(String(d.numero).slice(pre.length),10);if(n>max)max=n;}});
  return pre+pad4(max+1);
}
function pad4(n){return String(n).padStart(4,'0');}
function clientName(id){var c=byId(S.clients,id);return c?c.nom:'—';}
function dossierTotals(d){return totals(d.lignes,S.set.regimeTva==='franchise');}
function isLate(doc){return doc.type==='facture'&&doc.statut==='emise'&&doc.dateEcheance&&doc.dateEcheance<today();}
function puFromCatalogue(m){
  var p=num(m.prix),tva=S.set.regimeTva==='franchise'?0:num(S.set.tvaDefaut);
  if(S.set.prixCatalogue==='TTC'&&tva>0)p=p/(1+tva/100);
  return Math.round(p*10000)/10000;
}

/* ---------- Personnalisation (couleurs, logo) ---------- */
function hex2rgb(h){h=String(h||'').replace('#','').trim();if(h.length===3)h=h.replace(/./g,'$&$&');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;var n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgb2hex(a){return '#'+a.map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');}
function mixRgb(a,b,t){return a.map(function(v,i){return Math.round(v*(1-t)+b[i]*t);});}
function rgbS(a){return 'rgb('+a.join(',')+')';}
function lumi(a){return (0.299*a[0]+0.587*a[1]+0.114*a[2])/255;}
function PC(){return hex2rgb(S.set.couleurPrincipale)||[2,48,71];}
function PA(){return hex2rgb(S.set.couleurAccent)||[208,187,99];}
function PG(){return mixRgb(PA(),[255,255,255],0.5);}
function curLogo(){return S.set.logo||LOGO;}
function curLogoR(){return S.set.logo?(num(S.set.logoR)||3):LOGO_R;}
function applyTheme(){
  var st=document.getElementById('theme-custom');
  if(!st){st=document.createElement('style');st.id='theme-custom';document.body.appendChild(st);}
  var p=hex2rgb(S.set.couleurPrincipale),a=hex2rgb(S.set.couleurAccent),W=[255,255,255],K=[0,0,0],L='',D='';
  if(p){
    var ink=lumi(p)>0.55?mixRgb(p,K,0.6):p;
    L+='--accent:'+rgbS(ink)+';--ink:'+rgbS(ink)+';--accent-ink:'+(lumi(ink)>0.6?'#000':'#fff')+';--accent-soft:'+rgbS(mixRgb(p,W,0.88))+';--side-bg:'+rgbS(ink)+';--muted:'+rgbS(mixRgb(ink,W,0.35))+';';
    D+='--accent:'+rgbS(lumi(p)>0.5?p:mixRgb(p,W,0.6))+';--accent-ink:#021B28;--accent-soft:'+rgbS(mixRgb(p,K,0.55))+';--side-bg:'+rgbS(mixRgb(p,K,0.6))+';';
  }
  if(a){
    var gi=lumi(a)>0.55?'#1a1a1a':'#ffffff';
    L+='--gold:'+rgbS(a)+';--sun:'+rgbS(a)+';--gold-ink:'+gi+';--sun-soft:'+rgbS(mixRgb(a,W,0.78))+';';
    D+='--gold:'+rgbS(a)+';--sun:'+rgbS(a)+';--gold-ink:'+gi+';--sun-soft:'+rgbS(mixRgb(a,K,0.7))+';';
  }
  st.textContent=(L||D)?':root{'+L+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){'+D+'}}:root[data-theme="dark"]{'+D+'}':'';
}
function readLogo(file){
  if(!file||!/^image\//.test(file.type)){toast('Choisissez une image (PNG, JPG ou SVG).');return;}
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var mw=520,mh=260,sc=Math.min(1,mw/(im.naturalWidth||im.width||1),mh/(im.naturalHeight||im.height||1));
      var w=Math.max(1,Math.round((im.naturalWidth||im.width||300)*sc)),h=Math.max(1,Math.round((im.naturalHeight||im.height||100)*sc));
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      var url=c.toDataURL('image/png');
      if(url.length>700000){toast('Image trop lourde : choisissez un logo plus simple.');return;}
      S.set=Object.assign({},S.set,{logo:url,logoR:w/h});
      S.db.doc('config/societe').update({logo:url,logoR:w/h}).then(function(){toast('Logo enregistré');}).catch(dbErr);
      schedule();
    };
    im.onerror=function(){toast('Image illisible.');};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- Données ---------- */
function sub(name){
  S.db.collection(name).onSnapshot(function(snap){
    S[name]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});
    if(name==='caisses')S.caisses.forEach(function(o){if(CP[o.id])o.cnt=CP[o.id];});
    S.loaded[name]=true;checkReady();schedule();
  },function(e){S.error='Lecture impossible ('+(e&&e.code||'erreur')+').';schedule();});
}
function checkReady(){S.ready=['materiel','clients','dossiers','documents','taches','entretiens','caisses','config'].every(function(k){return S.loaded[k];});}
function initDb(){
  var c=window.claude;
  if(!c||!c.use){S.error="Le stockage n'est pas disponible dans cette vue. Ouvrez l'outil depuis claude.ai.";schedule();return;}
  c.use('db').then(function(db){
    if(!db){S.error="Le stockage n'est pas disponible dans cette vue.";schedule();return;}
    S.db=db;
    ['materiel','clients','dossiers','documents','taches','entretiens','caisses'].forEach(sub);
    db.doc('config/societe').onSnapshot(function(snap){
      S.set=Object.assign({},DEFAULT_SET,snap.exists?snap.data():{});applyTheme();S.loaded.config=true;checkReady();schedule();
    },function(e){S.error='Lecture impossible ('+(e&&e.code||'erreur')+').';schedule();});
  });
  c.use('downloads').then(function(d){S.dl=d;});
  c.use('mcp').then(function(m){S.mcp=m;S.mcpDone=true;if(S.view==='mails')render();}).catch(function(){S.mcpDone=true;if(S.view==='mails')render();});
}

  if(tAf.length>6)h+='<div class="small muted" style="padding:8px 4px">+ '+(tAf.length-6)+' autre(s) tâche(s)</div>';

/* --- Planning --- */
function planPick(y,mo,label){
  var mois=[];for(var i=0;i<12;i++)mois.push(new Date(2024,i,1).toLocaleDateString('fr-FR',{month:'long'}));
  var ys=[];for(var a=Math.min(y,new Date().getFullYear())-3;a<=Math.max(y,new Date().getFullYear())+5;a++)ys.push(a);
  return '<select data-plan="m" aria-label="Mois (affiché : '+esc(label)+')" style="text-transform:capitalize;min-width:0;width:auto">'+mois.map(function(n,i){return '<option value="'+i+'"'+(i===mo?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>'
   +'<select data-plan="y" aria-label="Année" style="min-width:0;width:auto">'+ys.map(function(a){return '<option value="'+a+'"'+(a===y?' selected':'')+'>'+a+'</option>';}).join('')+'</select>';
}
function vPlanning(){
  var m=S.month,y=m.getFullYear(),mo=m.getMonth();

  var jours=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(function(j){return '<div class="cal-h">'+j+'</div>';}).join('');
  var h=head('Planning','Locations par jour (devis, confirmées, livrées et terminées)','<button class="icon-btn" data-action="month" data-n="-1" aria-label="Mois précédent">'+ic('l')+'</button>'+planPick(y,mo,label)+'<button class="icon-btn" data-action="month" data-n="1" aria-label="Mois suivant">'+ic('r')+'</button><button class="btn btn-sm" data-action="month" data-n="0">Aujourd\'hui</button>');
  h+=legend+'<div class="card" style="overflow:hidden"><div class="cal">'+jours+cells+'</div></div>';

    h+='<div class="card" style="margin-top:14px"><div class="sec-title">'+fmtD(S.selDay)+'</div>';

    }

    else bar='<div class="small muted" style="padding:8px 12px">Astuce : cochez plusieurs devis d\'un même client pour créer une facture groupée.</div>';

/* --- Tâches et rappels --- */
var RELANCE_J=[2,4,7];
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function relanceDue(d){
  var okD=d.type==='devis'&&d.statut==='envoye',okF=d.type==='facture'&&d.statut==='emise';
  if(!okD&&!okF)return 0;
  var niv=num(d.relanceNiv);if(niv>=3)return 0;
  var base=okF?d.dateEcheance:(d.dateEnvoi||d.dateEmission);if(!base)return 0;
  return diffDays(base,today())>=RELANCE_J[niv]?niv+1:0;
}
function tacheSuggestions(){
  var t=today(),out=[];
  S.documents.forEach(function(d){
    var cn=(d.clientSnap&&d.clientSnap.nom)||'le client';
    var rd=relanceDue(d);
    if(rd&&d.type==='devis')out.push({titre:'Relance '+rd+'/3 : devis '+d.numero+' · '+cn,sub:'Envoyé il y a '+diffDays(d.dateEnvoi||d.dateEmission,t)+' jour(s), sans réponse',act:'q-relancer',id:d.id,n:rd,lab:'Préparer l\'e-mail'});
    else if(rd)out.push({titre:'Relance impayé '+rd+'/3 : facture '+d.numero+' · '+cn,sub:'Échéance dépassée depuis '+diffDays(d.dateEcheance,t)+' jour(s)',act:'q-relancer',id:d.id,n:rd,lab:'Préparer l\'e-mail'});
    else if(isLate(d))out.push({titre:'Relancer le paiement de la facture '+d.numero,sub:cn+' · échéance dépassée depuis le '+fmtD(d.dateEcheance),act:'open-doc',id:d.id,lab:'Ouvrir'});
  });
  S.dossiers.forEach(function(d){
    if(d.statut!=='option'&&ACTIFS.indexOf(d.statut)>=0&&d.dateDebut>=t&&d.dateDebut<=addDays(t,2)&&!d.rappelClient)out.push({titre:'Rappel client avant l\'événement : '+(d.titre||'Sans titre'),sub:clientName(d.clientId)+' · livraison le '+fmtD(d.dateDebut),act:'q-rappel',id:d.id,lab:'Préparer le message'});
  });
  S.dossiers.forEach(function(d){
    if(ACTIFS.indexOf(d.statut)>=0&&d.dateDebut>=t&&d.dateDebut<=addDays(t,2))out.push({titre:'Préparer la livraison : '+(d.titre||'Sans titre'),sub:'Livraison le '+fmtD(d.dateDebut)+' · '+clientName(d.clientId),act:'open-dossier',id:d.id,lab:'Ouvrir'});
  });
  S.entretiens.forEach(function(e){
    if(!e.prochainControle||e.prochainControle>addDays(t,7))return;
    var suivi=S.entretiens.some(function(x){return x.id!==e.id&&x.materielId===e.materielId&&x.date>e.date;});
    if(suivi)return;
    var m=byId(S.materiel,e.materielId);
    out.push({titre:'Contrôler : '+(m?m.nom:'matériel'),sub:'Contrôle prévu le '+fmtD(e.prochainControle),act:'nav',id:'entretien',lab:'Entretien'});
  });
  return out;
}
function vTaches(){
  var st=S.f.tstat||'afaire',sug=tacheSuggestions();
  var na=S.taches.filter(function(x){return x.statut!=='fait';}).length,nf=S.taches.length-na;
  var h=head('Tâches et rappels','Vos tâches, plus les rappels calculés à partir de vos devis, factures, livraisons et contrôles.','<button class="btn btn-primary" data-action="new-tache">'+ic('plus')+'Nouvelle tâche</button>');
  if(sug.length){
    h+='<div class="card" style="margin-bottom:14px"><div class="sec-title">Rappels automatiques ('+sug.length+')</div>';
    sug.forEach(function(x){h+='<div class="list-row"><div style="flex:1 1 240px;min-width:0"><b>'+esc(x.titre)+'</b><div class="small muted">'+esc(x.sub)+'</div></div><button class="btn btn-sm" data-action="'+x.act+'" data-id="'+esc(x.id)+'" data-v="'+esc(x.id)+'" data-n="'+esc(x.n||'')+'">'+esc(x.lab)+'</button></div>';});
    h+='</div>';
  }
  h+='<div class="toolbar"><div class="toolbar" style="margin:0;gap:6px"><button class="btn btn-sm'+(st==='afaire'?' btn-primary':'')+'" data-action="tstat" data-s="afaire">À faire ('+na+')</button><button class="btn btn-sm'+(st==='fait'?' btn-primary':'')+'" data-action="tstat" data-s="fait">Faites ('+nf+')</button></div></div>';
  h+='<div class="card" id="list">'+tacheList()+'</div>';
  return h;
}
function tacheList(){
  var st=S.f.tstat||'afaire',t=today();

  var o={materielId:mid,type:$('#e-type').value,date:$('#e-date').value||today(),description:$('#e-desc').value.trim(),cout:Math.max(0,num($('#e-cout').value)),qteHS:qte,prochainControle:$('#e-next').value||'',statut:stat};
  var oldD=(b.id&&b.statut==='ouvert')?num(b.qteHS):0,newD=stat==='ouvert'?qte:0,ps=[];
  if(b.id&&b.materielId&&b.materielId!==mid){if(oldD)ps.push(applyHS(b.materielId,-oldD));if(newD)ps.push(applyHS(mid,newD));}

  Promise.all(ps).then(function(){toast('Intervention enregistrée');closeModal();}).catch(dbErr);

var CP={},CPT={};
var CXM=[['e','Espèces'],['c','Carte bleue'],['q','Chèque']];
function cxK(cnt,tid,m){var v=num(cnt[tid+'|'+m]);if(m==='e')v+=num(cnt[tid]);return Math.max(0,Math.round(v));}
function cxTot(c){
  var cnt=c.cnt||{},tv=num(c.tva),ttc=0,n=0,mo={e:{n:0,ttc:0},c:{n:0,ttc:0},q:{n:0,ttc:0}};
  var lg=(c.tarifs||[]).map(function(t){
    var pu=num(t.prix),ms={},k=0;
    CXM.forEach(function(x){var q=cxK(cnt,t.id,x[0]);ms[x[0]]=q;k+=q;mo[x[0]].n+=q;mo[x[0]].ttc=r2(mo[x[0]].ttc+q*pu);});
    var tot=r2(k*pu);n+=k;ttc+=tot;
    return {id:t.id,nom:t.nom,prix:pu,n:k,total:tot,m:ms};});
  ttc=r2(ttc);var ht=r2(ttc/(1+tv/100));
  return {n:n,ttc:ttc,ht:ht,tva:r2(ttc-ht),taux:tv,lignes:lg,modes:mo};
}
function cxReel(c){return {e:String(c.especes||'').trim(),c:String(c.cb||'').trim(),q:String(c.cheque||'').trim()};}
function cxEcartHtml(c){
  var t=cxTot(c),r=cxReel(c),out=[],any=false;
  CXM.forEach(function(x){var k=x[0];if(r[k]==='')return;any=true;var e=r2(num(r[k])-t.modes[k].ttc);
    out.push('<div class="'+(Math.abs(e)<0.005?'cx-ok':'cx-bad')+'">'+x[1]+' : attendu <b>'+money(t.modes[k].ttc)+'</b> · compté <b>'+money(num(r[k]))+'</b> · écart <b>'+money(e)+'</b></div>');});
  return any?out.join(''):'';
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]');if(!t)return;
  var a=A[t.dataset.action];if(!a)return;
  if(t.dataset.action==='bg'&&e.target!==t)return;
  if(t.tagName==='BUTTON'||t.dataset.action==='bg'||true)a(t,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='d-client'){e.preventDefault();var rr=document.querySelectorAll('#cl-res .pick-row'),fb=rr[1]||rr[0];if(fb)fb.click();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='d-matsel'){e.preventDefault();addMatFromInput();return;}
  if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cal-d,.kpi-link')){e.preventDefault();e.target.click();}
});
function setTyping(on){var m=document.querySelector('.modal-bg');if(m)m.classList.toggle('typing',on);}
document.addEventListener('focusin',function(e){if(e.target&&e.target.id==='d-client'){e.target.select&&e.target.select();clSuggest();}if(e.target&&e.target.id==='d-matsel')setTyping(true);});
document.addEventListener('focusout',function(e){if(e.target&&e.target.id==='d-client')setTimeout(function(){var a=document.activeElement,b=document.getElementById('cl-res');if(b&&!(a&&a.id==='d-client'))b.innerHTML='';},250);if(e.target&&e.target.id==='d-matsel')setTimeout(function(){var a=document.activeElement;setTyping(!!(a&&a.id==='d-matsel'));},250);});
var FDB=0;
function refreshList(){var list=$('#list');if(!list)return;
  if(S.view==='dossiers')list.innerHTML=dossierList();else if(S.view==='documents')list.innerHTML=docList();else if(S.view==='clients')list.innerHTML=clientList();else if(S.view==='materiel')list.innerHTML=materielList();else if(S.view==='taches')list.innerHTML=tacheList();else if(S.view==='entretien')list.innerHTML=entretienList();}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.col){var o0={};o0[t.dataset.col]=t.value;S.set=Object.assign({},S.set,o0);applyTheme();return;}
  if(t.dataset.filter){
    var k=t.dataset.filter;S.f[k]=t.type==='checkbox'?t.checked:t.value;
    clearTimeout(FDB);FDB=setTimeout(refreshList,t.type==='search'||t.type==='text'?140:0);
    return;
  }
  if(t.dataset.clq){if(S.draft&&S.draft.clientId&&S.draft.clientId!=='__new'&&t.value!==clientName(S.draft.clientId))S.draft.clientId='';clSuggest();return;}
  if(t.dataset.matq){matSuggest();return;}
  if(t.dataset.pick!=null){PICK.q=t.value;var pr=$('#pick-res');if(pr)pr.innerHTML=pickResults();return;}
  if(S.modal==='dossier'&&S.draft){
    if(t.dataset.field){S.draft[t.dataset.field]=t.value;if(t.dataset.field==='dateDebut'||t.dataset.field==='dateFin')refreshDraft();return;}
    if(t.dataset.km){S.draft.km=t.value;applyKm();return;}
    if(t.dataset.rem){S.draft.rem=t.value;return;}
    if(t.dataset.nc){S.draft.nc[t.dataset.nc]=t.value;return;}
    if(t.dataset.line!=null&&t.dataset.lf!=='materielId'){var l=S.draft.lignes[+t.dataset.line];if(l){if(t.dataset.lf==='puTTC')l.puHT=Math.round(num(t.value)/(1+num(l.tva)/100)*10000)/10000;else l[t.dataset.lf]=t.value;refreshDraft();}}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.plan){var pm=document.querySelector('[data-plan="m"]'),py=document.querySelector('[data-plan="y"]');S.month=new Date(+py.value,+pm.value,1);render();return;}
  if(t.dataset&&t.dataset.pcAutre){PAYC.autre=t.value;renderPayCard(t.dataset.pcAutre);var ni=document.getElementById('pc-autre');if(ni){ni.focus();ni.setSelectionRange(ni.value.length,ni.value.length);}return;}
  if(t.id==='s-logo-file'){if(t.files&&t.files[0])readLogo(t.files[0]);return;}
  if(t.dataset&&t.dataset.col){var o1={};o1[t.dataset.col]=t.value;S.set=Object.assign({},S.set,o1);applyTheme();S.db.doc('config/societe').update(o1).then(function(){toast('Couleur enregistrée');}).catch(dbErr);return;}
  if(t.dataset.filter&&t.tagName==='SELECT'){S.f[t.dataset.filter]=t.value;if(t.dataset.filter==='dtype'||t.dataset.filter==='statut'||t.dataset.filter==='cat'){var list=$('#list');if(list){if(S.view==='dossiers')list.innerHTML=dossierList();else if(S.view==='documents')list.innerHTML=docList();else if(S.view==='materiel')list.innerHTML=materielList();else if(S.view==='taches')list.innerHTML=tacheList();else if(S.view==='entretien')list.innerHTML=entretienList();}}return;}
  if(t.dataset.cx){var cc=byId(S.caisses,t.dataset.id);if(cc){var upx={};upx[t.dataset.cx]=t.value;cc[t.dataset.cx]=t.value;cxRefresh(cc);S.db.collection('caisses').doc(cc.id).update(upx).catch(dbErr);}return;}
  if(t.dataset.stock){
    var v=Math.max(0,Math.round(num(t.value)));t.value=v;
    var up={};up[t.dataset.f]=v;if(t.dataset.f==='stock')up.stockAVerifier=false;
    S.db.collection('materiel').doc(t.dataset.stock).update(up).catch(dbErr);return;
  }
  if(t.dataset.docSt){var up0={statut:t.value},d0=byId(S.documents,t.dataset.docSt);if(t.value==='accepte'&&d0&&d0.type==='devis'&&!d0.signature){openSign(t.dataset.docSt);return;}if(t.value==='envoye'&&d0&&!d0.dateEnvoi){up0.dateEnvoi=today();up0.relanceNiv=0;}S.db.collection('documents').doc(t.dataset.docSt).update(up0).then(function(){toast('Statut mis à jour');}).catch(dbErr);return;}
  if(S.modal==='dossier'&&S.draft){
    if(t.dataset.field==='clientId'){S.draft.clientId=t.value;renderDossierModal();return;}
    if(t.dataset.field==='statut'){S.draft.statut=t.value;return;}
    if(t.dataset.line!=null){
      var l=S.draft.lignes[+t.dataset.line];if(!l)return;
      if(t.dataset.lf==='materielId'){
        l.materielId=t.value;var m=byId(S.materiel,t.value);
        if(m){l.designation=m.nom;l.puHT=puFromCatalogue(m);l.tva=S.set.regimeTva==='franchise'?0:num(S.set.tvaDefaut);}
        renderDossierModal();
      }else if(t.dataset.lf==='tva'){l.tva=num(t.value);refreshDraft();}
    }
  }
});
initDb();
render();
